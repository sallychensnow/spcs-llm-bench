# demo-account dry-run: reuse the server's vLLM image; scripts come from a stage mount.
spec:
  containers:
  - name: bench
    image: /qwen_multi_db/qwen_multi_sch/qwen_multi_model_repo_image/qwen_multimodel:v3
    command: ["bash", "/opt/bench/run_bench.sh"]
    env:
      TEST: "{{ test }}"
      RUN_ID: "{{ run_id }}"
      REPLICAS: "{{ replicas }}"
      CONCURRENCY_LEVELS: "{{ levels }}"
      BASE_URL: http://qwen-service:8000
      MODEL: Qwen/Qwen3.5-35B-A3B
      TOKENIZER: /models
      OUT_DIR: /results
      COLD_START_PY: /opt/bench/cold_start.py
      MIN_PROMPTS: "8"
    volumeMounts:
    - {name: scripts, mountPath: /opt/bench}
    - {name: models,  mountPath: /models}
    - {name: results, mountPath: /results}
    resources:
      requests: {cpu: 2, memory: 8Gi}
  volumes:
  - {name: scripts, source: "@QWEN_MULTI_DB.QWEN_MULTI_SCH.BENCH_SCRIPTS_STAGE"}
  - {name: models,  source: "@QWEN_MULTI_DB.QWEN_MULTI_SCH.MODEL_ARCHIVE_STAGE"}
  - {name: results, source: "@QWEN_MULTI_DB.QWEN_MULTI_SCH.BENCH_RESULTS_STAGE"}
